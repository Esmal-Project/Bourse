name: Market Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-data-relay
  cancel-in-progress: true

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch TSETMC market watch
        run: python3 scripts/fetch_market_watch.py

      - name: Publish snapshot
        run: |
          git config user.name "bourse-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-watch.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "chore: update market data [skip ci]"
          git push
