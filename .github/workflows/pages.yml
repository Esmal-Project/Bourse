name: Deploy Bourse Terminal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site and data
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsSL --max-time 10 "https://esmal-project.github.io/Bourse/" | grep -q "YASHAM"; then
              break
            fi
            sleep 5
          done
          curl -fsSL --max-time 20 "https://esmal-project.github.io/Bourse/app.js" -o /tmp/app.js
          node --check /tmp/app.js
          curl -fsSL --max-time 20 "https://esmal-project.github.io/Bourse/data/market-watch.json" -o /tmp/market-watch.json
          python3 - <<'PY'
          import json
          with open("/tmp/market-watch.json", encoding="utf-8") as f:
              d=json.load(f)
          rows=d.get("payload",{}).get("marketwatch",[])
          assert len(rows) >= 1000, f"too few market rows: {len(rows)}"
          print("LIVE SITE OK; MARKET ROWS:", len(rows))
          print("FETCHED AT:", d.get("fetchedAt"))
          print("SOURCE:", d.get("source"))
          PY

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'fa-IR'});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://esmal-project.github.io/Bourse/?smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5000);
            const before=await page.locator('#scanTableBody .scan-row').count();
            if(before<100)throw new Error('Market Watch table did not render enough rows: '+before);
            await page.locator('#inputSymbol').fill('بترانس');
            await page.locator('#loadBtn').click();
            await page.waitForTimeout(4000);
            const symbol=await page.locator('#symbol').textContent();
            const price=await page.locator('#price').textContent();
            const status=await page.locator('#status').textContent();
            if(!String(symbol).includes('بترانس'))throw new Error('Symbol search failed. symbol='+symbol+' status='+status+' price='+price);
            if(!price || price.trim()==='—')throw new Error('Symbol search returned no price. symbol='+symbol+' status='+status);
            if(errors.length)throw new Error('Browser page errors: '+errors.join(' | '));
            console.log('BROWSER SMOKE OK; rows=',before,'symbol=',symbol,'price=',price,'status=',status);
            await browser.close();
          })().catch(async e=>{console.error(e);process.exit(1)});
          NODE
